name: CCNAlab published beta browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/beta-browser-e2e.cjs'
      - '.github/workflows/beta-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CCNALAB_E2E_ORIGIN: https://deploy-preview-198--constant-app.netlify.app
      CCNALAB_EXPECTED_SHA: 25d4f3a7ab55ce66b68436795920eec5b24ccfce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Run real beta browser E2E against immutable Netlify Preview
        run: node scripts/beta-browser-e2e.cjs
