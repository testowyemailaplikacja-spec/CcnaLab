name: CCNAlab Beta quality
on:
  push:
    branches:
      - main
      - fix/beta-quality-p0-20261111
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: CCNAlab content, Packet Lab and beta checks
        run: npm run verify
